[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-router"
version = "0.2.0"
description = "Classify a task with TypeSafe Jev, then run a local model selected by your routing table"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "reallygood83"}]
dependencies = []

[project.scripts]
jev-router = "jev_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
